<button class="material-symbols-outlined text-muted-gray hover:text-electric-emerald transition-colors duration-200">

<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-electric-emerald/5 blur-[120px] rounded-full pointer-events-none"></div>
<!-- Success Animation Placeholder / Glow Checkmark -->
<div class="relative mb-stack-lg">
<div class="w-24 h-24 rounded-full border-2 border-electric-emerald flex items-center justify-center emerald-glow bg-electric-emerald/10">
<span class="material-symbols-outlined text-[48px] text-electric-emerald emerald-bloom" style="font-variation-settings: 'wght' 700;">
                    check
                </span>
</div>
</div>
<!-- Headline -->

<h1 class="font-display-lg text-headline-lg-mobile text-on-surface mb-unit">Link Generated!</h1>
<p class="font-body-sm text-muted-gray">Your premium VanLink is active and ready to share.</p>
</div>
<!-- Link Preview Card -->
<div class="w-full glass-card rounded-xl p-stack-md mb-stack-lg flex items-center justify-between group">

<span class="font-label-mono text-label-mono text-muted-gray uppercase mb-1">Your Link</span>
<span class="font-label-mono text-body-md text-electric-emerald">vdefi.link/x8j3...</span>

<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface" data-icon="chat_bubble">chat_bubble</span>
</div>

</div>
<span class="font-label-mono text-label-mono text-muted-gray">Telegram</span>
</button>

<span class="material-symbols-outlined text-on-surface" data-icon="mail">mail</span>
