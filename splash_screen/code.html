<style>
        body {
            background-color: #0A0A0A;
            margin: 0;
            overflow: hidden;
        }
        .emerald-glow {
            box-shadow: 0 0 60px 10px rgba(0, 255, 136, 0.15);
        }
        .loading-shimmer {
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.4), transparent);
            background-size: 200% 100%;
        }
        .cinematic-vignette {
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.8) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased text-on-background">
<!-- Splash Screen Container -->
<main class="relative h-screen w-screen flex flex-col items-center justify-center bg-matte-obsidian overflow-hidden">
<!-- Cinematic Depth Layers -->
<div class="absolute inset-0 cinematic-vignette pointer-events-none"></div>
<!-- Subtle Background Pattern / Ambient Lighting -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] opacity-10 pointer-events-none">
<div class="w-full h-full bg-electric-emerald blur-[120px] rounded-full"></div>
</div>
<!-- Hero Content / Logo Anchor -->
<div class="relative z-10 flex flex-col items-center">
<!-- Logo with Glow -->
<div class="relative p-8 rounded-full emerald-glow">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-electric-emerald tracking-tighter sm:font-headline-lg sm:text-headline-lg">
                    V DeFi
                </h1>
<!-- Reflected Cinematic Light Highlight -->
<div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/5 to-transparent rounded-full pointer-events-none"></div>
</div>
<!-- Secondary Brand Tagline (Subtle) -->
<p class="mt-stack-md font-label-mono text-label-mono text-muted-gray tracking-widest uppercase opacity-60">
                Institutional Grade Custody
            </p>
</div>
<!-- Footer Progress Indicator -->
<div class="absolute bottom-12 left-1/2 -translate-x-1/2 w-48 flex flex-col items-center gap-unit">
<!-- Progress Track -->
<div class="w-full h-[2px] bg-white/5 overflow-hidden rounded-full">
<!-- Active Loading State -->
<div class="h-full w-[65%] bg-electric-emerald rounded-full relative overflow-hidden">
<div class="absolute inset-0 loading-shimmer"></div>
</div>
</div>
<!-- Status Text -->
<span class="font-label-mono text-[10px] text-muted-gray uppercase tracking-tighter opacity-40">
                Initializing Secure Protocol
            </span>
</div>
<!-- Decorative UI Elements (Command Center Aesthetic) -->
<div class="absolute top-8 left-8">
<div class="flex items-center gap-unit">
<div class="w-1 h-1 bg-electric-emerald rounded-full"></div>
<span class="font-label-mono text-[10px] text-muted-gray/50 uppercase">v4.0.2 // encrypted</span>
</div>
</div>
<div class="absolute bottom-8 right-8">
<div class="flex items-center gap-unit">
<span class="font-label-mono text-[10px] text-muted-gray/50 uppercase">node_status: active</span>
<div class="w-1 h-1 bg-electric-emerald rounded-full"></div>
</div>
</div>
</main>
<!-- Shell Suppression: Splash screens are transactional/linear, so Navigation Shells are hidden per rule. -->
</body></html>
